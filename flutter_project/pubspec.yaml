name: doodh_dost
description: "Doodh Dost — Your daily milk business, made simple. Production Flutter app for milk distributors."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.0.1

  # Backend & Supabase
  supabase_flutter: ^2.5.6

  # Local Persistence & Offline Caching
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # UI, Icons, & Polish
  google_fonts: ^6.2.1
  intl: ^0.20.2
  lucide_icons: ^0.257.0
  flutter_svg: ^2.0.10+1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.16.0
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/mascot/
